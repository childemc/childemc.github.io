{%- for url in page.extra_css -%}
<link rel="stylesheet" href="{% if url contains '://' %}{{ url }}{% else %}{{ url | relative_url }}{% endif %}" />
{%- endfor -%}
{%- for url in page.head_js -%}
<script src="{% if url contains '://' %}{{ url }}{% else %}{{ url | relative_url }}{% endif %}"></script>
{%- endfor -%}
